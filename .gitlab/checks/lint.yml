lint_python:
  extends: .lint_base
  image:
    name: ghcr.io/astral-sh/ruff:0.17.6-alpine
    entrypoint: [""]
  script:
    - ruff check . --output-format=gitlab > gl-code-quality-report.json || ruff check .
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week
    when: always

hadolint:
  extends: .lint_base
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint airflow/Dockerfile* api-prod/Dockerfile* api-predict/Dockerfile*

helm-lint:
  extends: .lint_base
  image:
    name: alpine/helm:3
    entrypoint: [""]
  script:
    - helm lint k3s/apis -f k3s/apis/values.yaml
    - helm template apis k3s/apis -f k3s/apis/values.yaml > /dev/null

.lint_base:
  stage: quality
  image: python:3.11-slim
  tags:
    - runner-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test_kube"
