gitleaks:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.0
    entrypoint: [""]
  tags:
    - runner-lint
  variables:
    GIT_DEPTH: 0
  rules:
    - when: always
  interruptible: true
  timeout: 10 minutes
  script:
    - bash .gitlab/scripts/gitleaks.sh
  artifacts:
    paths:
      - gitleaks-report.sarif
    expire_in: 1 week
    when: always
