build_push_job:
  stage: build
  image: docker:$DOCKER_VERSION
  tags:
    - runner-build
  rules:
    - if: $CI_COMMIT_BRANCH == "test_kube"
  timeout: 20 minutes
  parallel:
    matrix:
      - APP: ["airflow", "api-prod", "api-predict"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - SHA_TAG="$CI_REGISTRY_IMAGE/$APP:$CI_COMMIT_SHORT_SHA"
    - docker build -t "$SHA_TAG" -f "$APP/Dockerfile" .
    - docker push "$SHA_TAG"
