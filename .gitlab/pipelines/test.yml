test-docker-image:
  stage: test
  image: docker:$DOCKER_VERSION
  needs:
    - job: build_push_job
  tags:
    - runner-build
  rules:
    - if: $CI_COMMIT_BRANCH == "test_kube"
  timeout: 20 minutes
  parallel:
    matrix:
      - APP: ["airflow", "api-prod", "api-predict"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$APP:$CI_COMMIT_SHORT_SHA"
    - docker pull $IMAGE
    - |
      if [ "$APP" = "airflow" ]; then
        CHECK="from airflow import DAG; print('OK')"
      else
        CHECK="from main import app; print('OK')"
      fi
    - docker run --rm $IMAGE python -c "$CHECK"
