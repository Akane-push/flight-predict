deploy_to_test-kube:
  stage: deploy-test
  needs:
    - job: build_push_job
    - job: test-docker-image
  tags:
    - runner-test-kube
  resource_group: test-kube
  environment:
    name: serveur-test-kube
  rules:
    - if: $CI_COMMIT_BRANCH == "test_kube"
  timeout: 15 minutes
  variables:
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - bash .gitlab/scripts/deploy-kube.sh

deploy_to_prod:
  stage: deploy-prod
  tags:
    - runner-prod
  resource_group: prod
  environment:
    name: serveur-prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  timeout: 15 minutes
  variables:
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - bash .gitlab/scripts/deploy-kube.sh
