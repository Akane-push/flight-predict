stages:
  - security
  - quality
  - build
  - test
  - deploy-test
  - deploy-prod

variables:
  DOCKER_VERSION: "29.0.4"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "test_kube"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - local: ".gitlab/checks/gitleaks.yml"
  - local: ".gitlab/checks/lint.yml"
  - local: ".gitlab/pipelines/build.yml"
  - local: ".gitlab/pipelines/test.yml"
  - local: ".gitlab/pipelines/deploy.yml"
