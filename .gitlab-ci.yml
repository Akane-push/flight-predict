stages:
  - security
  - quality
  - build
  - test
  - check-env
  - deploy-test
  - deploy-prod

variables:
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH-$CI_COMMIT_SHA
  DOCKER_VERSION: "29.0.4"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        VERSION_TAG: "latest"
    - if: $CI_COMMIT_BRANCH == "test_kube"
      variables:
        VERSION_TAG: "test"
    - if: $CI_COMMIT_BRANCH == "test_server"
    - when: always

include:
  - local: ".gitlab/checks/gitleaks.yml"
  - local: ".gitlab/checks/lint.yml"
  - local: ".gitlab/pipelines/build.yml"
  - local: ".gitlab/pipelines/test.yml"
  - local: ".gitlab/checks/check-processor.yml"
  - local: ".gitlab/pipelines/deploy.yml"
  # - local: ".gitlab/pipelines/compose.yml"
