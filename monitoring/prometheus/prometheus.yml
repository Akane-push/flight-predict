global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-prod'
    static_configs:
      - targets: ['api-prod:8081']

  - job_name: 'api-predict'
    static_configs:
      - targets: ['api-predict:8001']

  - job_name: 'airflow'
    static_configs:
      - targets: ['statsd-exporter:9102']
