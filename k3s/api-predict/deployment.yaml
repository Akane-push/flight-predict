apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-predict
  namespace: flight-predict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-predict
      version: with-polars
  template:
    metadata:
      labels:
        app: api-predict
        version: with-polars
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      nodeSelector:
        polars-compatible: "true"
      containers:
      - name: api-predict
        image: registry.gitlab.com/Akane-Push/flight-predict/api-predict:test-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: EXTRACTED_PATH
          value: /app/extracted
        - name: PENDING_PATH
          value: /app/pending
        - name: ARCHIVES_PATH
          value: /app/archives
        - name: MODEL_PATH
          value: /app/output_model
        envFrom:
        - secretRef:
            name: lufth-credentials
        volumeMounts:
        - name: common-data
          mountPath: /app/extracted
          subPath: Weekly
        - name: common-data
          mountPath: /app/pending
          subPath: Pending
        - name: common-data
          mountPath: /app/archives
          subPath: Archives
        - name: common-data
          mountPath: /app/output_model
          subPath: Model
      volumes:
        - name: common-data
          persistentVolumeClaim:
            claimName: data-pvc