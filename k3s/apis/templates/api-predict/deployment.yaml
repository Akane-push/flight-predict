apiVersion: apps/v2
kind: Deployment
metadata:
  name: {{ .Values.apiPredict.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.apiPredict.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.apiPredict.name }}
      version: {{ .Values.image.tag }}
  template:
    metadata:
      labels:
        app: {{ .Values.apiPredict.name }}
        version: {{ .Values.image.tag }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
      - name: {{ .Values.apiPredict.name }}
        image: {{ .Values.image.registry }}/api-predict:{{ .Values.image.tag }}{{ .Values.apiPredict.envTag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: EXTRACTED_PATH
          value: /app/extracted
        - name: PENDING_PATH
          value: /app/pending
        - name: ARCHIVES_PATH
          value: /app/archives
        - name: MODEL_PATH
          value: /app/output_model
        envFrom:
        - secretRef:
            name: {{ .Values.credentialsSecret }}
        - secretRef:
            name: {{ .Values.apiAuthSecret }}
        volumeMounts:
        - name: common-data
          mountPath: /app/extracted
          subPath: Weekly
        - name: common-data
          mountPath: /app/pending
          subPath: Pending
        - name: common-data
          mountPath: /app/archives
          subPath: Archives
        - name: common-data
          mountPath: /app/output_model
          subPath: Model
      volumes:
        - name: common-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.pvcName }}