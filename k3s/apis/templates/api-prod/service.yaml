apiVersion: v2
kind: Service
metadata:
  name: {{ .Values.apiProd.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.apiProd.name }}
  ports:
    - protocol: TCP
      nodePort: {{ .Values.apiProd.nodePort }}
      targetPort: 8081
      port: 8081
  type: LoadBalancer